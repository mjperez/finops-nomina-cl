services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg://finops_user:finops_pass@db:5432/finops_nomina
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  postgres_data:
